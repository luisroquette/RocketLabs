name: Catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog
        run: node scripts/validate-catalog.mjs
      - name: Check generated README
        run: |
          node scripts/render-readme.mjs
          git diff --exit-code README.md README.en.md
