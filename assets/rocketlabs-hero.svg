<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RocketLabs</title>
  <desc id="desc">Digital products, AI systems and developer tools ready to explore.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset=".48" stop-color="#10152A"/>
      <stop offset="1" stop-color="#071A21"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9B87F5"/>
      <stop offset="1" stop-color="#38D6C7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#9B87F5" stop-opacity=".34"/>
      <stop offset="1" stop-color="#9B87F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="960" cy="80" r="235" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="105" cy="360" r="150" fill="#38D6C7" opacity=".07" filter="url(#blur)"/>

  <g fill="#fff">
    <circle cx="75" cy="67" r="1.5" opacity=".5"/>
    <circle cx="161" cy="113" r="1" opacity=".35"/>
    <circle cx="262" cy="57" r="1.5" opacity=".45"/>
    <circle cx="347" cy="153" r="1" opacity=".3"/>
    <circle cx="482" cy="74" r="1.3" opacity=".45"/>
    <circle cx="712" cy="46" r="1.3" opacity=".45"/>
    <circle cx="814" cy="128" r="1" opacity=".4"/>
    <circle cx="1090" cy="54" r="1.6" opacity=".55"/>
    <circle cx="1142" cy="172" r="1" opacity=".35"/>
    <circle cx="1040" cy="355" r="1.3" opacity=".45"/>
  </g>

  <g transform="translate(70 62)">
    <rect width="118" height="32" rx="16" fill="#12182C" stroke="#2A3459"/>
    <circle cx="18" cy="16" r="5" fill="#38D6C7">
      <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" fill="#AAB3D2" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">OPEN LAB</text>
  </g>

  <text x="70" y="167" fill="#F7F8FF" font-family="Inter,Arial,sans-serif" font-size="67" font-weight="800" letter-spacing="-2">ROCKET</text>
  <text x="329" y="167" fill="url(#accent)" font-family="Inter,Arial,sans-serif" font-size="67" font-weight="800" letter-spacing="-2">LABS</text>
  <text x="72" y="211" fill="#ABB5D3" font-family="Inter,Arial,sans-serif" font-size="19">AI systems · digital products · developer tools</text>
  <text x="72" y="239" fill="#ABB5D3" font-family="Inter,Arial,sans-serif" font-size="19">Built to be explored.</text>

  <g transform="translate(72 285)">
    <rect width="182" height="42" rx="11" fill="url(#accent)"/>
    <text x="17" y="27" fill="#081018" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">EXPLORE THE LAB</text>
    <path d="M154 21h10m-4-4 4 4-4 4" fill="none" stroke="#081018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="72" y="370" fill="#687397" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.2">OBSERVE  ·  BUILD  ·  VALIDATE  ·  OPEN  ·  EVOLVE</text>

  <g transform="translate(714 62)" filter="url(#soft)">
    <rect width="416" height="296" rx="24" fill="#0C1121" stroke="#27304E"/>
    <rect x="22" y="22" width="372" height="34" rx="9" fill="#12192D"/>
    <circle cx="40" cy="39" r="4" fill="#F06A7A"/>
    <circle cx="54" cy="39" r="4" fill="#F3B85A"/>
    <circle cx="68" cy="39" r="4" fill="#38D6C7"/>
    <text x="282" y="43" fill="#697597" font-family="ui-monospace,monospace" font-size="10">rocketlabs://home</text>

    <g transform="translate(27 78)">
      <rect width="174" height="86" rx="14" fill="#151B32" stroke="#343E65"/>
      <circle cx="25" cy="25" r="9" fill="#9B87F5" opacity=".9"/>
      <path d="M21 25h8M25 21v8" stroke="#0C1121" stroke-width="2"/>
      <text x="43" y="29" fill="#E9ECF8" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">Content systems</text>
      <rect x="19" y="49" width="110" height="6" rx="3" fill="#384262"/>
      <rect x="19" y="63" width="78" height="5" rx="2.5" fill="#252E49"/>
    </g>
    <g transform="translate(215 78)">
      <rect width="174" height="86" rx="14" fill="#101F2B" stroke="#285364"/>
      <circle cx="25" cy="25" r="9" fill="#38D6C7" opacity=".9"/>
      <path d="M21 25h8M25 21v8" stroke="#0C1121" stroke-width="2"/>
      <text x="43" y="29" fill="#E9ECF8" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">Developer tools</text>
      <rect x="19" y="49" width="118" height="6" rx="3" fill="#2D5260"/>
      <rect x="19" y="63" width="88" height="5" rx="2.5" fill="#203C48"/>
    </g>
    <g transform="translate(27 178)">
      <rect width="362" height="86" rx="14" fill="#12172A" stroke="#2A3454"/>
      <text x="19" y="25" fill="#747F9F" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">LAB ACTIVITY</text>
      <path d="M20 60 C65 52, 78 69, 116 50 S177 61, 215 39 S276 56, 342 25" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <circle r="5" fill="#38D6C7">
        <animateMotion dur="4s" repeatCount="indefinite" path="M20 60 C65 52, 78 69, 116 50 S177 61, 215 39 S276 56, 342 25"/>
      </circle>
    </g>
  </g>
</svg>
